<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>U.S. AutoForce &mdash; 3D Desktop</title>
<meta name="description" content="U.S. AutoForce 3D animated desktop / wallpaper. Works offline, single file.">
<style>

/* ================= base ================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#04060d;color:#fff;overflow:hidden;
  font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  --hy:47%;          /* horizon line, shared by ground planes + flare */
  --ox:0px; --oy:0px;/* parallax offset, written by JS per layer */
  --rx:0deg; --ry:0deg;
}

body[data-scene="night"]{
  --sky-top:#150c33; --sky-glow:#3a2a72; --sky-bot:#04060d;
  --sun-a:#ffd166; --sun-b:#ff2d6f; --sun-slat:rgba(6,8,18,.86);
  --halo:rgba(140,50,200,.32);
  --grid:rgba(150,235,255,.55);
  --road-a:#1b2547; --road-b:#070a16;
  --dash:rgba(255,205,0,.85);
  --edge:rgba(255,255,255,.60);
  --lane:rgba(226,29,39,.65);
  --hz-a:rgba(160,230,255,.80); --hz-b:rgba(255,45,111,.45);
}
body[data-scene="dawn"]{
  --sky-top:#3d1019; --sky-glow:#7a2226; --sky-bot:#0a0508;
  --sun-a:#ffe3a3; --sun-b:#e21d27; --sun-slat:rgba(20,4,6,.82);
  --halo:rgba(226,29,39,.34);
  --grid:rgba(255,150,110,.45);
  --road-a:#2b1418; --road-b:#0a0506;
  --dash:rgba(255,235,180,.85);
  --edge:rgba(255,220,190,.60);
  --lane:rgba(255,120,90,.60);
  --hz-a:rgba(255,210,150,.85); --hz-b:rgba(226,29,39,.55);
}
body[data-scene="indigo"]{
  --sky-top:#0c1540; --sky-glow:#1e2375; --sky-bot:#03060e;
  --sun-a:#dbe8ff; --sun-b:#3f6ad8; --sun-slat:rgba(4,8,20,.84);
  --halo:rgba(30,35,117,.45);
  --grid:rgba(190,225,255,.50);
  --road-a:#16224a; --road-b:#060a16;
  --dash:rgba(190,235,255,.85);
  --edge:rgba(255,255,255,.65);
  --lane:rgba(30,58,138,.70);
  --hz-a:rgba(200,225,255,.80); --hz-b:rgba(63,106,216,.50);
}
body[data-scene="stealth"]{
  --sky-top:#121212; --sky-glow:#2a2a2a; --sky-bot:#050505;
  --sun-a:#e8e8e8; --sun-b:#6b6b6b; --sun-slat:rgba(8,8,8,.85);
  --halo:rgba(255,255,255,.10);
  --grid:rgba(255,255,255,.30);
  --road-a:#181818; --road-b:#070707;
  --dash:rgba(255,205,0,.80);
  --edge:rgba(255,255,255,.45);
  --lane:rgba(255,205,0,.45);
  --hz-a:rgba(255,255,255,.55); --hz-b:rgba(255,205,0,.30);
}


/* ================= scene ================= */
.scene{position:fixed;inset:0;overflow:hidden;
  perspective:2600px;perspective-origin:50% var(--hy)}

/* full-bleed backdrop layers (not parallax) */
.sky{position:absolute;inset:0;
  background:radial-gradient(ellipse 130% 82% at 50% 0%,var(--sky-glow) 0%,
    var(--sky-top) 46%,var(--sky-bot) 100%)}
.stars{position:absolute;inset:0;opacity:.9;animation:twinkle 5.5s ease-in-out infinite;
  background:
    radial-gradient(1.4px 1.4px at 12% 18%,#fff,transparent),
    radial-gradient(1.4px 1.4px at 28% 8%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 41% 24%,#fff,transparent),
    radial-gradient(1.6px 1.6px at 57% 11%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 68% 27%,#fff,transparent),
    radial-gradient(1.4px 1.4px at 79% 14%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 88% 31%,#fff,transparent),
    radial-gradient(1.3px 1.3px at 93% 6%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 6% 34%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 35% 4%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 64% 36%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 84% 40%,#fff,transparent)}
@keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}

/* ---- parallax layers: JS writes --ox/--oy px per layer (no CSS math) ---- */
.scene > [data-d]{position:absolute;left:50%;
  transform:translate3d(calc(-50% + var(--ox)),var(--oy),0);
  will-change:transform}

.halo{top:2%;width:1150px;height:1150px;border-radius:50%;
  background:radial-gradient(circle,var(--halo) 0%,transparent 66%)}
.sun{top:30%;width:520px;height:520px;border-radius:50%;position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--sun-a),var(--sun-b));
  animation:sunPulse 7s ease-in-out infinite}
.sun::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(180deg,transparent 0 8px,var(--sun-slat) 8px 14px);
  -webkit-mask-image:linear-gradient(180deg,transparent 0 40%,#000 78%);
  mask-image:linear-gradient(180deg,transparent 0 40%,#000 78%)}
@keyframes sunPulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.04);opacity:1}}

/* flat flare straddling the horizon (screen space, not on the plane) */
.horizon{top:calc(var(--hy) - 90px);width:6000px;height:180px;
  background:linear-gradient(180deg,var(--hz-a),var(--hz-b) 42%,transparent);
  filter:blur(3px)}

/* ---- the two ground planes (drawn after the sun so they occlude below it) ---- */
.scene > .grid,.scene > .road{top:var(--hy);transform-origin:50% 0;
  transform:translate3d(calc(-50% + var(--ox)),var(--oy),0) rotateX(-70deg)}

.grid{width:6000px;height:6000px}
.grid .mv{position:absolute;left:0;right:0;top:-64px;height:calc(100% + 64px);
  background:
    repeating-linear-gradient(0deg,var(--grid) 0 2px,transparent 2px 64px),
    repeating-linear-gradient(90deg,var(--grid) 0 2px,transparent 2px 64px);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 46%);
  mask-image:linear-gradient(180deg,transparent 0,#000 46%);
  animation:gridRun 2.6s linear infinite}
@keyframes gridRun{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,64px,0)}}

.road{width:1500px;height:6000px;
  background:
    linear-gradient(90deg,var(--edge) 0 10px,transparent 10px calc(100% - 10px),
      var(--edge) calc(100% - 10px) 100%),
    linear-gradient(180deg,var(--road-a) 0%,var(--road-b) 55%,#03050c 100%);
  box-shadow:inset 0 0 300px rgba(0,0,0,.7)}
.road .dash{position:absolute;top:-160px;left:50%;width:48px;margin-left:-24px;
  height:calc(100% + 160px);
  background:repeating-linear-gradient(180deg,transparent 0 110px,var(--dash) 110px 150px,
    transparent 150px 160px);
  animation:roadRun .62s linear infinite}
.road .lanes{position:absolute;top:-160px;left:0;right:0;height:calc(100% + 160px);
  background:linear-gradient(90deg,
    var(--lane) 0 16px,transparent 16px calc(50% - 160px),
    var(--lane) calc(50% + 144px) calc(50% + 160px),transparent calc(50% + 160px) calc(100% - 16px),
    var(--lane) calc(100% - 16px));
  -webkit-mask-image:repeating-linear-gradient(180deg,#000 0 60px,transparent 60px 160px);
  mask-image:repeating-linear-gradient(180deg,#000 0 60px,transparent 60px 160px);
  animation:roadRun .62s linear infinite}
@keyframes roadRun{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,160px,0)}}

/* ---- finishing passes ---- */
.streaks{position:absolute;inset:0;opacity:.5;animation:streak 3.2s linear infinite;
  background:
    linear-gradient(90deg,transparent 0 46%,rgba(255,255,255,.10) 46.2%,transparent 46.6%),
    linear-gradient(90deg,transparent 0 53%,rgba(255,255,255,.10) 53.2%,transparent 53.6%)}
@keyframes streak{from{transform:translate3d(0,0,0)}to{transform:translate3d(-9%,0,0)}}
.vignette{position:absolute;inset:0;
  background:radial-gradient(ellipse 106% 94% at 50% 47%,transparent 55%,rgba(2,3,8,.6) 100%)}
.scanlines{position:absolute;inset:0;opacity:.16;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.5) 0 1px,transparent 1px 3px)}
/* darkens the middle so the wordmark/clock stay readable over a busy scene */
.scrim{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 44% at 50% 47%,rgba(3,5,12,.60) 0%,
    rgba(3,5,12,.34) 56%,transparent 78%)}

/* ================= deck ================= */
.deck{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;pointer-events:none;
  padding:0 4vw;text-align:center;transition:opacity .4s}
.lockup{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;
  transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .2s ease-out}
/* soft dark plate so the lockup reads over the brightest part of the scene */
.lockup::before{content:'';position:absolute;left:-9%;right:-9%;top:-30px;bottom:-30px;
  border-radius:34px;background:rgba(3,5,12,.46);filter:blur(28px);z-index:-1}

.logo3d{position:relative;transform-style:preserve-3d;animation:float 6.5s ease-in-out infinite}
.logo3d img{display:block;width:min(44vw,430px);height:auto;border-radius:18px;
  box-shadow:0 26px 66px rgba(0,0,0,.66),0 0 52px rgba(226,29,39,.40)}
.logo3d::after{content:'';position:absolute;inset:0;border-radius:18px;pointer-events:none;
  background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.30) 48%,transparent 62%);
  mix-blend-mode:screen;animation:sheen 5.5s ease-in-out infinite}
/* Iowa: the Tigerhawk is a TRANSPARENT gold png, so it needs neither the white
   tile nor a border radius that the jpg logo build needs. */
body[data-variant="iowa"] .logo3d img{width:min(31vw,320px);border-radius:0}
.iowamark{display:block;width:min(21vw,268px);height:auto;margin:18px auto 0;opacity:.95;
  filter:drop-shadow(0 3px 16px rgba(0,0,0,.92))}
body[data-variant="iowa"] .lockup{gap:4px}
@keyframes float{0%,100%{transform:translate3d(0,0,0) rotateX(0)}
  50%{transform:translate3d(0,-14px,40px) rotateX(5deg)}}
@keyframes sheen{0%{transform:translate3d(-120%,0,0)}55%,100%{transform:translate3d(120%,0,0)}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wordmark{font-size:clamp(30px,5.4vw,66px);font-weight:800;letter-spacing:.16em;
  color:#fff;text-transform:uppercase;
  text-shadow:0 2px 0 rgba(30,35,117,.85),0 3px 0 rgba(226,29,39,.45),
    0 6px 20px rgba(0,0,0,.8)}
.tagline{font-size:clamp(10px,1.25vw,15px);letter-spacing:.32em;text-transform:uppercase;
  color:rgba(255,205,0,.95);text-shadow:0 2px 12px rgba(0,0,0,.95)}

.clockbox{display:flex;flex-direction:column;align-items:center;gap:5px}
.clockrow{display:flex;align-items:baseline;gap:14px}
.clock{font-size:clamp(58px,12.5vw,164px);font-weight:800;line-height:.9;
  font-variant-numeric:tabular-nums;letter-spacing:.01em;color:#fff;
  text-shadow:0 2px 0 rgba(255,205,0,.45),0 4px 0 rgba(226,29,39,.45),
    0 8px 34px rgba(0,0,0,.85)}
.ampm{font-size:clamp(14px,2.2vw,28px);font-weight:700;letter-spacing:.12em;
  color:#FFCD00;text-shadow:0 2px 12px rgba(0,0,0,.95)}
.date{font-size:clamp(11px,1.5vw,19px);letter-spacing:.32em;text-transform:uppercase;
  color:rgba(255,255,255,.88);text-shadow:0 2px 12px rgba(0,0,0,.95)}

/* ================= control bar ================= */
.hud{position:fixed;left:50%;bottom:22px;transform:translate(-50%,150%);z-index:20;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  padding:9px 14px;border-radius:12px;max-width:94vw;
  background:linear-gradient(135deg,rgba(8,12,26,.93),rgba(16,24,52,.93));
  border:1px solid rgba(255,255,255,.14);box-shadow:0 12px 40px rgba(0,0,0,.62);
  opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s;pointer-events:none}
body.showhud .hud{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.hud button{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.16);
  border-radius:7px;padding:7px 11px;font:600 12px/1 'Segoe UI',Arial,sans-serif;cursor:pointer;
  letter-spacing:.3px;transition:background .15s,transform .12s}
.hud button:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.hud button:active{transform:translateY(1px)}
.hud button.act{background:#FFCD00;color:#0b1120;border-color:transparent;
  box-shadow:0 3px 0 rgba(226,29,39,.7)}
.hud .sep{width:1px;height:22px;background:rgba(255,255,255,.16)}
.hud .lbl{font:600 10px/1 'Segoe UI',Arial,sans-serif;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(255,255,255,.55);padding:0 2px}

.hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:19;
  font:600 10px/1 'Segoe UI',Arial,sans-serif;letter-spacing:.20em;text-transform:uppercase;
  color:rgba(255,255,255,.36);opacity:0;transition:opacity .6s;pointer-events:none}
body.hinthud .hint{opacity:1}

/* view modes */
body[data-view="focus"] .hud{transform:translate(-50%,150%);opacity:0;pointer-events:none}
body[data-view="pure"] .deck{opacity:0}
body[data-view="pure"] .hud{transform:translate(-50%,150%);opacity:0;pointer-events:none}
body[data-view="pure"] .hint{opacity:0}

body.paused *{animation-play-state:paused !important}
body.lite .stars,body.lite .streaks,body.lite .scanlines{display:none}
/* goes idle (cursor hidden) ~3s after the last mouse move / keypress */
body.idle{cursor:none}

@media (max-width:700px){
  .deck{gap:16px}
  .hud{bottom:14px;padding:7px 10px;gap:6px}
  .hud button{padding:6px 9px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;animation-iteration-count:1 !important}
}

</style>
</head>

     the wallpaper build and a bare #fsBtn in the lively build.)               */
  try {
  function $(s) { return document.querySelector(s); }
  var body = document.body;

  /* ---------------- clock (branded build only) ---------------- */
  var cEl = document.getElementById("clock");
  if (cEl) {
    var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    var MONTHS = ["January","February","March","April","May","June","July",
                  "August","September","October","November","December"];
    var aEl = $("#ampm"), dEl = $("#date");
    function pad(n) { return n < 10 ? "0" + n : "" + n; }
    function tick() {
      var d = new Date(), h = d.getHours(), m = d.getMinutes();
      var h12 = h % 12; if (h12 === 0) h12 = 12;
      cEl.textContent = h12 + ":" + pad(m);
      aEl.textContent = h >= 12 ? "PM" : "AM";
      dEl.textContent = DAYS[d.getDay()] + " \u00B7 " + MONTHS[d.getMonth()] + " " +
                        d.getDate() + ", " + d.getFullYear();
    }
    tick(); setInterval(tick, 1000);
  }

  /* ---------------- mouse parallax (px written per layer) ---------------- */
  var layers = [].slice.call(document.querySelectorAll(".scene > [data-d]"));
  var depths = layers.map(function (el) { return parseFloat(el.getAttribute("data-d")) || 0; });
  var tx = 0, ty = 0, drift = true;
  function apply() {
    for (var i = 0; i < layers.length; i++) {
      layers[i].style.setProperty("--ox", (tx * depths[i]).toFixed(1) + "px");
      layers[i].style.setProperty("--oy", (-ty * depths[i]).toFixed(1) + "px");
    }
    body.style.setProperty("--rx", (ty * -4).toFixed(2) + "deg");
    body.style.setProperty("--ry", (tx * 5).toFixed(2) + "deg");
  }
  function onMove(e) {
    poke();
    if (drift) {
      tx = (e.clientX / Math.max(1, window.innerWidth) - 0.5) * 2;
      ty = (e.clientY / Math.max(1, window.innerHeight) - 0.5) * 2;
      apply();
    }
    hudSoon();
  }
  window.addEventListener("mousemove", onMove, { passive: true });

  /* ---------------- idle: hide the cursor, then the control bar -------
     Behind the desktop icons the cursor is Explorer-drawn, so the lively
     build skips the whole idle/pointer-lock dance.                          */
  var idleT = 0;
  function poke() {
    body.classList.remove("idle");
    if (!true) return;
    clearTimeout(idleT);
    idleT = setTimeout(function () {
      body.classList.remove("showhud", "hinthud");
      body.classList.add("idle");
    }, 3000);
  }
  if (true) window.addEventListener("keydown", poke, true);

  /* ---------------- auto-hiding control bar ---------------- */
  var hudT = 0;
  function hudSoon() {
    if (!true) return;
    if (body.dataset.view === "pure" && !false) return;
    body.classList.add("showhud");
    clearTimeout(hudT);
    hudT = setTimeout(function () { body.classList.remove("showhud"); }, 2600);
  }
  poke();
  if (true) setTimeout(function () {
    body.classList.add("showhud", "hinthud");
    setTimeout(function () { body.classList.remove("hinthud"); }, 6500);
    hudSoon();
  }, 700);

  /* ---------------- speed (Web Animations playbackRate) ---------------- */
  var RATES = [0, 0.35, 0.6, 1, 1.6, 2.4], si = 3, sp = 1;
  var speedLabel = $("#speedLabel"), pauseBtn = $("#pauseBtn");
  function renderSpeed() {
    if (speedLabel) speedLabel.textContent = sp === 0 ? "Paused" : sp.toFixed(2).replace(/0$/, "") + "x";
    if (pauseBtn) {
      pauseBtn.textContent = sp === 0 ? "Resume" : "Pause";
      pauseBtn.classList.toggle("act", sp === 0);
    }
  }
  function setSpeed(i) {
    si = Math.max(0, Math.min(RATES.length - 1, i));
    sp = RATES[si];
    body.classList.toggle("paused", sp === 0);
    if (document.getAnimations) {
      document.getAnimations().forEach(function (a) { a.playbackRate = sp; });
    }
    renderSpeed();
  }
  function bumpSpeed(d) { setSpeed(si + d); }
  if (pauseBtn) pauseBtn.addEventListener("click", function () { setSpeed(sp === 0 ? si || 3 : 0); });
  if ($("#slowerBtn")) $("#slowerBtn").addEventListener("click", function () { bumpSpeed(-1); });
  if ($("#fasterBtn")) $("#fasterBtn").addEventListener("click", function () { bumpSpeed(1); });

  /* ---------------- scenes ---------------- */
  var SCENES = [["night", "Night Highway"], ["dawn", "Crimson Dawn"], ["indigo", "Indigo Deck"], ["stealth", "Stealth"]];
  var sceneBtn = $("#sceneBtn");
  function setScene(name) {
    body.dataset.scene = name;
    for (var i = 0; i < SCENES.length; i++) {
      if (SCENES[i][0] === name && sceneBtn) sceneBtn.textContent = "Scene: " + SCENES[i][1];
    }
    try { localStorage.setItem("af3d-scene", name); } catch (e) {}
    if (document.getAnimations) {  /* new CSS vars -> refresh, keep rate */
      document.getAnimations().forEach(function (a) { a.playbackRate = sp; });
    }
  }
  function cycleScene() {
    var cur = body.dataset.scene, i = 0;
    for (var k = 0; k < SCENES.length; k++) if (SCENES[k][0] === cur) i = k;
    setScene(SCENES[(i + 1) % SCENES.length][0]);
  }
  if (sceneBtn) sceneBtn.addEventListener("click", cycleScene);

  /* ---------------- view mode (branded build only -- the wallpaper has no deck) */
  var VIEWS = ["full", "focus", "pure"];
  var viewBtn = $("#viewBtn");
  function setView(v) {
    body.dataset.view = v;
    if (viewBtn) {
      viewBtn.textContent = v === "full" ? "View: Full"
        : (v === "focus" ? "View: Focus" : "View: Pure");
      viewBtn.classList.toggle("act", v !== "full");
    }
    if (v === "full") hudSoon();
  }
  if (viewBtn) viewBtn.addEventListener("click", function () {
    var i = VIEWS.indexOf(body.dataset.view);
    setView(VIEWS[(i + 1) % VIEWS.length]);
  });

  /* ---------------- lite mode ---------------- */
  var liteBtn = $("#liteBtn");
  function setLite(on) {
    body.classList.toggle("lite", on);
    if (liteBtn) {
      liteBtn.classList.toggle("act", on);
      liteBtn.textContent = on ? "Lite: On" : "Lite: Off";
    }
    try { localStorage.setItem("af3d-lite", on ? "1" : "0"); } catch (e) {}
  }
  if (liteBtn) liteBtn.addEventListener("click", function () { setLite(!body.classList.contains("lite")); });

  /* ---------------- drift / parallax toggle (wallpaper build) -------- */
  var driftBtn = document.getElementById("driftBtn");
  function setDrift(on) {
    drift = !!on;
    if (driftBtn) {
      driftBtn.classList.toggle("act", drift);
      driftBtn.textContent = drift ? "Drift: On" : "Drift: Off";
    }
    if (!drift) { tx = 0; ty = 0; apply(); }
    try { localStorage.setItem("af3d-drift", drift ? "1" : "0"); } catch (e) {}
  }
  if (driftBtn) driftBtn.addEventListener("click", function () { setDrift(!drift); });

  /* ---------------- fullscreen ---------------- */
  function toggleFS() {
    var d = document;
    if (!d.fullscreenElement && !d.webkitFullscreenElement) {
      var el = d.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) { try { req.call(el); } catch (e) {} }
    } else {
      var ex = d.exitFullscreen || d.webkitExitFullscreen;
      if (ex) { try { ex.call(d); } catch (e) {} }
    }
  }
  if ($("#fsBtn")) $("#fsBtn").addEventListener("click", toggleFS);

  /* ---------------- keyboard (Lively disables keyboard input by default) --- */
  window.addEventListener("keydown", function (e) {
    var k = e.key;
    if (!true) return;
    if (k === "f" || k === "F") toggleFS();
    else if (true && (k === "p" || k === "P")) setView("pure");
    else if (true && (k === "h" || k === "H")) setView(body.dataset.view === "full" ? "focus" : "full");
    else if (k === " ") { e.preventDefault(); pauseBtn.click(); }
    else if (k >= "1" && k <= "4") setScene(SCENES[+k - 1][0]);
    else if (k === "ArrowDown") { e.preventDefault(); bumpSpeed(-1); }
    else if (k === "ArrowUp") { e.preventDefault(); bumpSpeed(1); }
    else return;
    hudSoon();
  });

  /* ---------------- Lively Wallpaper property API ------------------------- */
  /* Lively calls livelyPropertyListener(name, val) on load with the defaults
     from LivelyProperties.json and again on every change the user makes.       */
  if (false) {
    /* Lively sends real booleans for checkboxes.  Be tolerant of the
       string forms too -- !!"false" is true, which would silently pin
       parallax and Lite mode ON forever. */
    function toBool(v) {
      return v === true || v === 1 || v === "1" || v === "true";
    }
    window.livelyPropertyListener = function (name, val) {
      if (name === "scene") {
        setScene(SCENES[+val] ? SCENES[+val][0] : "night");
      } else if (name === "speed") {
        var i = Math.round((Math.max(0, Math.min(100, +val)) / 100) * (RATES.length - 1));
        setSpeed(Math.max(1, i));          /* never index 0 == fully paused */
      } else if (name === "parallax") {
        setDrift(toBool(val));
      } else if (name === "lite") {
        setLite(toBool(val));
      }
    };
  }

  /* ---------------- restore prefs ---------------- */
  if (true) {
    var sScene = null, sLite = null, sDrift = null;
    try {
      sScene = localStorage.getItem("af3d-scene");
      sLite = localStorage.getItem("af3d-lite");
      sDrift = localStorage.getItem("af3d-drift");
    } catch (e) {}
    setScene(sScene || "night");
    setLite(sLite === "1");
    setDrift(sDrift === null ? true : sDrift === "1");
  } else {
    /* Lively owns persistence -- it calls livelyPropertyListener on load */
    setScene("night");
    setLite(false);
    setDrift(true);
  }
  setView("full");
  setSpeed(3);
  } catch (err) {
    document.documentElement.setAttribute("data-app-error", err && err.message ? err.message : String(err));
    throw err;
  }
})();

</script>
</body>
</html>
